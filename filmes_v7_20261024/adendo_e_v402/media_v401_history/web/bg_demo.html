<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGL · Cosmos verificável</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./fonts.css"><link rel="stylesheet" href="./filmes.css"></head><body><main class="demo"><a href="./filmes.html">← Voltar aos filmes</a><p class="eyebrow">COSMOS [INPUT] · GEOMETRIA [ONTO]</p><h1>Um percurso contínuo.</h1><p>Movimente o ponteiro e explore a transformação. Sem temporizador GPU confiável ou com p95 acima de 8 ms, a cena usa uma imagem.</p><canvas id="cosmos" width="960" height="540" aria-label="Diagrama do cosmos"></canvas><label>Progresso<input id="progress" type="range" min="0" max="1" step=".001" value=".5"></label><label>Qualidade<select id="quality"><option value="0.5">0,5</option><option selected value="0.75">0,75</option><option value="1">1</option></select></label><div class="actions"><button id="diagnostics">Atualizar diagnóstico</button><button id="destroy">Encerrar cena</button></div><pre id="diagnostic" aria-live="polite"></pre></main><script type="module">
import {mount} from './bg_scene.js';
const canvas=document.querySelector('#cosmos'),bg=mount(canvas);window.backgroundController=bg;bg.setProgress(.5);
const show=()=>document.querySelector('#diagnostic').textContent=JSON.stringify(bg.getDiagnostics(),null,2);await bg.ready;show();
document.querySelector('#progress').oninput=e=>{bg.setProgress(Number(e.target.value));show();};document.querySelector('#quality').onchange=e=>{bg.setQuality(Number(e.target.value));show();};
canvas.onpointermove=e=>{const r=canvas.getBoundingClientRect();bg.setPointer(2*(e.clientX-r.left)/r.width-1,1-2*(e.clientY-r.top)/r.height);};
document.querySelector('#diagnostics').onclick=show;document.querySelector('#destroy').onclick=()=>{bg.destroy();show();};window.addEventListener('pagehide',()=>bg.destroy());
</script></body></html>
